services:
  proxy:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build: .
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.hallo.rule=Host(`hallo.localhost`)
      - traefik.http.routers.hallo.entrypoints=web
      - traefik.http.services.hallo.loadbalancer.server.port=5001

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-daten:/data

  whoami:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
      - traefik.http.routers.whoami.entrypoints=web

volumes:
  redis-daten: